apiVersion: v1
kind: Service
metadata:
  name: {{ include "tripla-apps.backendFullname" . }}
  labels:
    {{- include "tripla-apps.backendLabels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
  selector:    
    {{- include "tripla-apps.backendSelectorLabels" . | nindent 4 }}
